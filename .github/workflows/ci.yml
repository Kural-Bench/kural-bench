name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q
      - run: kuralbench build --check
      - run: kuralbench selfcheck
      - run: kuralbench verify-source
      - run: kuralbench release --check
      - run: python tools/site/build.py --check
